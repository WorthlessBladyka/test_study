version: 2
services:
    jenkins:
        image: jenkins/jenkins:latest
        container_name: jenkins_docker_sock
        ports:
          - "8080:8080"
          - "50000:50000"
        volumes:
          - "~/jenkins_home:/var/jenkins_home"
          - "/var/run/docker.sock:/var/run/docker.sock"
networks:
    identidock-net:
        driver: bridge