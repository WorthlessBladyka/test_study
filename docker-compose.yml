version: "2"
services:
  redis:
    image: redis:7.4
    networks:
      - identidock-net
  dnmonster:
    image: amouat/dnmonster:1.1
    networks:
      - identidock-net
  app:
    build: .
    networks:
      - identidock-net
    ports:
      - "5000:5000"
    environment:
      ENV: DEV
networks:
  identidock-net:
    driver: bridge