services:
  app:
    build: ./application/
    container_name: app
    networks:
      - identidock-net
    ports:
      - "5000:5000"
    environment:
      ENV: DEV
  reverse-proxy:
    build: ./reverse-proxy/
    container_name: reverse-proxy
    networks:
      - identidock-net
    ports:
      - "8000:80"
networks:
  identidock-net:
    driver: bridge
    external: true 
