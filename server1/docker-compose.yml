services:
  app:
    build: ./exercise1
    networks:
      - identidock-net
    environment:
      ENV: DEV

  reverse-proxy:
    image: nginx:1.28.3
    container_name: reverse_nginx
    volumes:
      - "./nginx:/etc/nginx"
    ports:
      - "8080:80"
    networks:
      - identidock-net

networks:
  identidock-net:
    driver: bridge